<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lab Week 8</title>
  </head>
  <body>
    <br />
    <hr />
    <br />
    <div><button id="Start1">Start</button></div>
    <div>
      <input
        id="freq"
        type="range"
        min="0.01"
        max="40"
        step="0.1"
        value="0.1"
      /><label id="CutOff_Display"> LP CutOff</label>
    </div>
    <div>
      <input
        id="rate"
        type="range"
        min="0.125"
        max="10"
        step="0.001"
        value="3"
      /><label id="Rate_Display">Rate</label>
    </div>

    <br />
    <hr />
    <br />

    <div><button id="Start2">Start</button></div>
    <div>
      <input
        id="freq2"
        type="range"
        min="0.01"
        max="40"
        step="0.1"
        value="0.1"
      /><label id="CutOff_Display2"> HP CutOff</label>
    </div>
    <div>
      <input
        id="rate2"
        type="range"
        min="0.125"
        max="10"
        step="0.001"
        value="3"
      /><label id="Rate_Display2">Rate</label>
    </div>

    <br />
    <hr />
    <br />

    <div><button id="Start3">Start</button></div>
    <div>
      <input
        id="freq3"
        type="range"
        min="0.01"
        max="40"
        step="0.1"
        value="0.1"
      /><label id="CutOff_Display3"> LP CutOff</label>
    </div>
    <div>
      <input
        id="rate3"
        type="range"
        min="0.125"
        max="10"
        step="0.001"
        value="3"
      /><label id="Rate_Display3">Rate</label>
    </div>
    <br />
    <hr />
    <br />

    <script>
      // master audio context and gain

      const ctx = new AudioContext();
      const master = new GainNode(ctx);
      master.gain.value = 0.2;
      master.connect(ctx.destination);

      // swell 1

      const adsrSwell = function () {
        mainOsc.frequency.value = Math.random() * 200 + 100;

        ctx.resume();

        let now = ctx.currentTime;

        adsr.gain.cancelScheduledValues(now);
        adsr.gain.setValueAtTime(adsr.gain.value, now);

        adsr.gain.linearRampToValueAtTime(0, now + 0.005);
        adsr.gain.exponentialRampToValueAtTime(1, now + 0.005 + 1.5);
        adsr.gain.exponentialRampToValueAtTime(0.0001, now + 0.005 + 1.5 + 3.5);
      };

      // swell 2

      const adsrSwell2 = function () {
        mainOsc2.frequency.value = Math.random() * 150 + 200;

        ctx.resume();

        let now = ctx.currentTime;

        adsr2.gain.cancelScheduledValues(now);
        adsr2.gain.setValueAtTime(adsr2.gain.value, now);

        adsr2.gain.linearRampToValueAtTime(0, now + 0.005);
        adsr2.gain.exponentialRampToValueAtTime(1, now + 0.005 + 1.5);
        adsr2.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.005 + 1.5 + 3.5,
        );
      };

      // swell 3

      const adsrSwell3 = function () {
        mainOsc3.frequency.value = Math.random() * 100 + 200;

        ctx.resume();

        let now = ctx.currentTime;

        adsr3.gain.cancelScheduledValues(now);
        adsr3.gain.setValueAtTime(adsr3.gain.value, now);

        adsr3.gain.linearRampToValueAtTime(0, now + 0.005);
        adsr3.gain.exponentialRampToValueAtTime(1, now + 0.005 + 1.5);
        adsr3.gain.exponentialRampToValueAtTime(
          0.0001,
          now + 0.005 + 1.5 + 3.5,
        );
      };

      // 1

      const mainOsc = new OscillatorNode(ctx);
      mainOsc.type = "sawtooth";

      const lpFilter = new BiquadFilterNode(ctx);
      lpFilter.type = "lowpass";
      lpFilter.frequency.value = 800; // Base cutoff frequency
      lpFilter.Q = 8; // Add resonance for a more noticeable sweep

      const lfo = new OscillatorNode(ctx);
      lfo.type = "sine";
      lfo.frequency.value = 4; // Speed of modulation (3 Hz / 3 times per second)

      const lfoDepth = new GainNode(ctx);
      lfoDepth.gain.value = 10000; // Modulates the cutoff by +/- 500Hz (Sweep range: 300Hz to 1300Hz)

      lfo.connect(lfoDepth);
      lfoDepth.connect(lpFilter.frequency); // Target the filter's frequency parameter

      const adsr = new GainNode(ctx);
      adsr.gain.value = 0;

      mainOsc.connect(lpFilter);
      lpFilter.connect(adsr);
      adsr.connect(master);
      master.connect(ctx.destination);

      mainOsc.start();
      lfo.start();

      // 2

      const mainOsc2 = new OscillatorNode(ctx);
      mainOsc2.type = "triangle";

      const hpFilter2 = new BiquadFilterNode(ctx);
      hpFilter2.type = "highpass";
      hpFilter2.frequency.value = 1000; // Base cutoff frequency
      hpFilter2.Q = 5; // Add resonance for a more noticeable sweep

      const lfo2 = new OscillatorNode(ctx);
      lfo2.type = "sine";
      lfo2.frequency.value = 4; // Speed of modulation (3 Hz / 3 times per second)

      const lfoDepth2 = new GainNode(ctx);
      lfoDepth2.gain.value = 500; // Modulates the cutoff by +/- 500Hz (Sweep range: 300Hz to 1300Hz)

      lfo2.connect(lfoDepth2);
      lfoDepth2.connect(hpFilter2.frequency); // Target the filter's frequency parameter

      const adsr2 = new GainNode(ctx);
      adsr2.gain.value = 0;

      mainOsc2.connect(hpFilter2);
      hpFilter2.connect(adsr2);
      adsr2.connect(master);
      master.connect(ctx.destination);

      mainOsc2.start();
      lfo2.start();

      // 3

      const mainOsc3 = new OscillatorNode(ctx);
      mainOsc3.type = "square";

      const lpFilter3 = new BiquadFilterNode(ctx);
      lpFilter3.type = "lowpass";
      lpFilter3.frequency.value = 200; // Base cutoff frequency
      lpFilter3.Q = 6; // Add resonance for a more noticeable sweep

      const lfo3 = new OscillatorNode(ctx);
      lfo3.type = "sine";
      lfo3.frequency.value = 4; // Speed of modulation (3 Hz / 3 times per second)

      const lfoDepth3 = new GainNode(ctx);
      lfoDepth3.gain.value = 600; // Modulates the cutoff by +/- 500Hz (Sweep range: 300Hz to 1300Hz)

      lfo3.connect(lfoDepth3);
      lfoDepth3.connect(lpFilter3.frequency); // Target the filter's frequency parameter

      const adsr3 = new GainNode(ctx);
      adsr3.gain.value = 0;

      mainOsc3.connect(lpFilter3);
      lpFilter3.connect(adsr3);
      adsr3.connect(master);
      master.connect(ctx.destination);

      mainOsc3.start();
      lfo3.start();

      // Input controls

      const theClickButton = document.querySelector("#Start1");

      theClickButton.addEventListener("click", adsrSwell);

      const slider1 = document.querySelector("#freq");
      slider1.addEventListener("input", () => {
        ctx.resume();
        lfoDepth.gain.value = 100 * Number(slider1.value);
        document.querySelector("#CutOff_Display").textContent = slider1.value;
      });

      const slider2 = document.querySelector("#rate");
      slider2.addEventListener("input", () => {
        ctx.resume();
        lfo.frequency.value = Number(slider2.value);
        document.querySelector("#Rate_Display").textContent = slider2.value;
      });

      //

      const theClickButton2 = document.querySelector("#Start2");

      theClickButton2.addEventListener("click", adsrSwell2);

      const slider3 = document.querySelector("#freq2");
      slider3.addEventListener("input", () => {
        ctx.resume();
        lfoDepth2.gain.value = 100 * Number(slider3.value);
        document.querySelector("#CutOff_Display2").textContent = slider3.value;
      });

      const slider4 = document.querySelector("#rate2");
      slider4.addEventListener("input", () => {
        ctx.resume();
        lfo2.frequency.value = Number(slider4.value);
        document.querySelector("#Rate_Display2").textContent = slider4.value;
      });

      //

      const theClickButton3 = document.querySelector("#Start3");

      theClickButton3.addEventListener("click", adsrSwell3);

      const slider5 = document.querySelector("#freq3");
      slider5.addEventListener("input", () => {
        ctx.resume();
        lfoDepth3.gain.value = 100 * Number(slider5.value);
        document.querySelector("#CutOff_Display3").textContent = slider5.value;
      });

      const slider6 = document.querySelector("#rate3");
      slider6.addEventListener("input", () => {
        ctx.resume();
        lfo3.frequency.value = Number(slider6.value);
        document.querySelector("#Rate_Display3").textContent = slider6.value;
      });
    </script>
  </body>
</html>
